# Stack de développement local. Voir CLAUDE.md pour les commandes.
services:
  app:
    build:
      context: docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: sjo2-php
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
      - mailpit

  db:
    # O2Switch fournit MySQL.
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sjo2
      MYSQL_USER: sjo2
      MYSQL_PASSWORD: sjo2
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

  # Interface web d'exploration de la base : http://localhost:3000
  dbgate:
    image: dbgate/dbgate
    ports:
      - "3000:3000"
    environment:
      CONNECTIONS: sjo2
      LABEL_sjo2: SJO2 (MySQL locale)
      SERVER_sjo2: db
      PORT_sjo2: 3306
      USER_sjo2: sjo2
      PASSWORD_sjo2: sjo2
      DATABASE_sjo2: sjo2
      ENGINE_sjo2: mysql@dbgate-plugin-mysql
    volumes:
      - dbgate:/root/.dbgate
    depends_on:
      - db

  node:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    profiles: ["front"]

volumes:
  mysqldata:
  dbgate:
