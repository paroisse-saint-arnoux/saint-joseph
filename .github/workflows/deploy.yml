# Déploiement sur O2Switch : build (Composer + Vite), envoi FTP, puis appel du hook
# /api/deploy qui lance les migrations et reconstruit les caches (pas d'accès SSH).
#
# Secrets GitHub à définir (Settings > Secrets and variables > Actions) :
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   DEPLOY_URL (ex. https://saint-joseph.saint-arnoux.fr), DEPLOY_TOKEN (= DEPLOY_TOKEN du .env serveur)
# Facultatif (onglet « Variables ») : FTP_SERVER_DIR, dossier de destination relatif au
# dossier d'arrivée du compte FTP (par défaut ./). Ne pas en faire un secret : sa valeur
# serait masquée partout dans les logs.
name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: gd, intl, zip, exif, bcmath, pdo_sqlite
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: gd, intl, zip, exif, bcmath

      - name: Dépendances PHP (production)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Compilation SCSS / JS
        run: npm ci && npm run build

      - name: Envoi FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Chemin relatif au dossier d'arrivée du compte FTP (comme le site de la paroisse).
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          protocol: ftps
          # Seuls les fichiers modifiés sont envoyés. Les images ajoutées depuis l'admin
          # (storage/app/public) ne sont jamais supprimées : elles ne viennent pas du dépôt.
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            node_modules/**
            tests/**
            legacy/**
            docker/**
            docker-compose.yml
            .env
            .env.*
            phpunit.xml
            storage/logs/**
            storage/framework/cache/data/**
            storage/framework/sessions/**
            storage/framework/views/**
            bootstrap/cache/*.php

      - name: Migrations et caches
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
            "${{ secrets.DEPLOY_URL }}/api/deploy"
