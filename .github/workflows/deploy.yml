# Publication : à chaque push sur main, tests puis mise à jour de la branche `production`
# (= main + front compilé dans public/build, ignoré sur main).
# Le serveur O2Switch récupère ensuite cette branche avec ./deploy.sh (à la main ou en cron) :
# GitHub n'a aucun accès au serveur, aucun secret n'est nécessaire.
name: Publication

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: gd, intl, zip, exif, bcmath, pdo_sqlite
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  production:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Compilation SCSS / JS
        run: npm ci && npm run build

      # Un seul commit au-dessus de main, poussé en force : le serveur fait un
      # `git checkout -f -B production origin/production` (cf. deploy.sh).
      - name: Branche production (main + public/build)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B production
          git add -f public/build
          git commit -q -m "Production : main ${GITHUB_SHA::7} + front compilé"
          git push -f origin production
